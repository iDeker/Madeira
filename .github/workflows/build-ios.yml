name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Find Project File
      id: find_proj
      run: |
        PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
        if [ -z "$PROJ" ]; then
          echo "No .xcodeproj file found!"
          exit 1
        fi
        echo "Found project at: $PROJ"
        echo "path=$PROJ" >> $GITHUB_OUTPUT

    - name: Create Basic ExportOptions.plist
      run: |
        cat <<EOF > ExportOptions.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF

    - name: Build Archive
      run: |
        xcodebuild -project "${{ steps.find_proj.outputs.path }}" \
                   -scheme Madeira \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath $PWD/build/Madeira.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   archive

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
                   -archivePath $PWD/build/Madeira.xcarchive \
                   -exportOptionsPlist ExportOptions.plist \
                   -exportPath $PWD/build/ipa \
                   CODE_SIGNING_ALLOWED=NO

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira-IPA
        path: build/ipa/*.ipa
