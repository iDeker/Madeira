name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code with Submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Select Xcode 15.4
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Find Project File
      id: find_proj
      run: |
        PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
        if [ -z "$PROJ" ]; then
          echo "No .xcodeproj file found!"
          exit 1
        fi
        echo "Found project at: $PROJ"
        echo "path=$PROJ" >> $GITHUB_OUTPUT

    - name: Create Missing Resource Dummy Files
      run: |
        mkdir -p app/Madeira
        touch app/Madeira/x86_64-vcruntime

    - name: Build App Bundle
      run: |
        xcodebuild -project "${{ steps.find_proj.outputs.path }}" \
                   -scheme Madeira \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build/DerivedData \
                   CODE_SIGNING_ALLOWED=YES \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="-" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   build

    - name: Create IPA Package
      run: |
        mkdir -p build/ipa/Payload
        APP_PATH=$(find build/DerivedData -name "Madeira.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Madeira.app not found in DerivedData!"
          exit 1
        fi
        cp -R "$APP_PATH" build/ipa/Payload/
        cd build/ipa
        zip -r Madeira.ipa Payload
        cd ../..

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira-IPA
        path: build/ipa/Madeira.ipa
