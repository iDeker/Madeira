name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select installed Xcode
        shell: bash
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1)

          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode installation found."
            exit 1
          fi

          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcode-select -p
          xcodebuild -version

      - name: Install dependencies
        run: |
          if [ -f "Gemfile" ]; then
            bundle install
          fi

      - name: Build
        run: |
          xcodebuild \
            -project "*.xcodeproj" \
            -scheme "YOUR_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            build
```
