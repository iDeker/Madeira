name: Build Madeira

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Configure FEX for iOS
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/FEX/build-ios/install"

      - name: Generate FEX configuration headers
        shell: bash
        run: |
          set -euxo pipefail

          # ConfigValues.inl is generated by FEX's CMake configuration.
          find FEX/build-ios FEX -name ConfigValues.inl -print

          if ! find FEX/build-ios FEX -name ConfigValues.inl -print -quit | grep -q .; then
            echo "::error::FEX ConfigValues.inl was not generated"
            exit 1
          fi

      - name: Build FEX
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build FEX/build-ios \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Verify FEX headers
        shell: bash
        run: |
          set -euxo pipefail

          CONFIG_HEADER="$(find "$PWD/FEX/build-ios" -name ConfigValues.inl -print -quit)"

          if [ -z "$CONFIG_HEADER" ]; then
            echo "::error::Could not find ConfigValues.inl"
            exit 1
          fi

          echo "Found: $CONFIG_HEADER"

          CONFIG_DIR="$(dirname "$CONFIG_HEADER")"
          echo "FEX generated config directory: $CONFIG_DIR"

      - name: Build Madeira
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/DerivedData

          xcodebuild \
            -project "./app/Madeira.xcodeproj" \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ENABLE_MODULES=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            build
